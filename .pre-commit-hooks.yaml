# Pre-commit hooks for Apogee smart contract security scanning
# See https://pre-commit.com for more information

- id: 0xapogee-scan
  name: Apogee Security Scan
  description: Scan smart contracts for security vulnerabilities
  entry: 0xapogee scan run
  language: python
  types_or: [solidity, file]
  files: \.(sol|vy|rs)$
  args:
    - --fail-on=high
    - --output=table
  pass_filenames: true
  require_serial: true
  stages: [commit]

- id: 0xapogee-scan-critical
  name: Apogee Critical Only
  description: Scan for critical vulnerabilities only (faster)
  entry: 0xapogee scan run
  language: python
  types_or: [solidity, file]
  files: \.(sol|vy|rs)$
  args:
    - --fail-on=critical
    - --output=table
  pass_filenames: true
  require_serial: true
  stages: [commit]

- id: 0xapogee-scan-sarif
  name: Apogee SARIF Output
  description: Scan with SARIF output for CI integration
  entry: 0xapogee scan run
  language: python
  types_or: [solidity, file]
  files: \.(sol|vy|rs)$
  args:
    - --fail-on=high
    - --output=sarif
  pass_filenames: true
  require_serial: true
  stages: [commit, push]
